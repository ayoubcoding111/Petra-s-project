<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Home of Mind Drift</title>
  <meta name="description" content="Home of Mind Drift: an interactive book. Prototype.">
  <meta name="theme-color" content="#f5efe1">
  <!-- First paint is the cream intro, before any stylesheet or font arrives. -->
  <style>html { background: #f5efe1; }</style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <!-- Only the weights in use: Cormorant (titles), EB Garamond (text), Special Elite (typewriter). -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Special+Elite&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="in-intro">
  <div class="site">
    <header class="topbar">
      <span class="brand">Home of Mind Drift</span>
      <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="false">Sound: off</button>
    </header>

    <!-- Typewriter intro: covers the screen until the message is typed, then fades into the book -->
    <section class="intro" id="intro" aria-label="Welcome">
      <div class="intro-sheet" id="introSheet">
        <p class="typed"><span id="typed"></span><span class="typed-cursor" aria-hidden="true"></span></p>
      </div>
      <button class="skip" id="skipIntro" type="button">Skip intro</button>
    </section>

    <main class="stage">
      <div class="book-wrap" id="bookWrap">
        <div class="book" id="book" data-spread="0">
          <div class="edges edges-left" id="edgesLeft" aria-hidden="true"></div>
          <div class="edges edges-right" id="edgesRight" aria-hidden="true"></div>
          <div class="page page-left" id="pageLeft"></div>
          <div class="page page-right" id="pageRight"></div>
          <div class="under-shade" id="underShade" aria-hidden="true"></div>
          <div class="cast-clip" aria-hidden="true"><div class="cast" id="cast"></div></div>
          <!-- The sheet that physically turns. app.js builds its curling strips; it only shows during a turn. -->
          <div class="leaf" id="leaf" aria-hidden="true" inert></div>
        </div>
      </div>

      <nav class="controls" aria-label="Book navigation">
        <!-- How far through the book: shown as a thin line on phones -->
        <div class="progress" aria-hidden="true"><span id="progressFill"></span></div>
        <button class="nav-btn" id="prevBtn" type="button" aria-label="Previous page">
          <span class="nav-arrow" aria-hidden="true">&larr;</span><span class="nav-label"> Previous</span>
        </button>
        <div class="where">
          <p class="position" id="position" aria-live="polite"></p>
          <button class="contents-btn" id="contentsBtn" type="button">Contents</button>
        </div>
        <button class="nav-btn" id="nextBtn" type="button" aria-label="Next page">
          <span class="nav-label">Next </span><span class="nav-arrow" aria-hidden="true">&rarr;</span>
        </button>
      </nav>
    </main>
  </div>

  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script defer src="app.js"></script>
</body>
</html>
